name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/test-report.mjs
      - run: npm run proof
      - run: npm run bench
      - run: npm ci --prefix app --ignore-scripts
      - run: npm run site:build

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-report.mjs
      - run: npm run proof
      - run: npm run bench
      - run: npm ci --prefix app --ignore-scripts
      - run: npm run site:build
      - run: npm run validate:site
